workflows:
  ios-workflow:
    name: WilApp iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "kotlin-multiplatform"
          include: true
          source: true
    scripts:
      - name: Instalar XcodeGen
        script: |
          brew install xcodegen
      - name: Generar proyecto Xcode
        script: |
          cd iosApp
          xcodegen generate
      - name: Compilar framework compartido (Kotlin Multiplatform)
        script: |
          ./gradlew :shared:assembleXCFramework
      - name: Compilar app iOS
        script: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build
    artifacts:
      - iosApp/build/**/*.app
    publishing:
      email:
        recipients:
          - acrolopez3@gmail.com
