name: iosApp
options:
  bundleIdPrefix: com.domicilioswil
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domicilioswil.app
        INFOPLIST_FILE: iosApp/Info.plist
        FRAMEWORK_SEARCH_PATHS:
          - "$(PROJECT_DIR)/../shared/build/XCFrameworks/release"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/Frameworks"
    info:
      path: iosApp/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "Domicilios WIL"
    dependencies:
      - framework: "../shared/build/XCFrameworks/release/shared.xcframework"
        embed: true
