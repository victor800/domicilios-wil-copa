name: iosApp
options:
  bundleIdPrefix: com.domicilioswil
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domicilioswil.app
        INFOPLIST_FILE: iosApp/Info.plist
    info:
      path: iosApp/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "Domicilios WIL"
