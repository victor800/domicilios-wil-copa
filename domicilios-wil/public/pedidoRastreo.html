<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>WIL – Rastreo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #0ceac9;
    --orange-light: #0fe4f3;
    --orange-bg: #fff7ed;
    --dark: #1c1917;
    --text: #292524;
    --muted: #78716c;
    --border: #e7e5e4;
    --white: #ffffff;
    --nav-h: 70px;
    --header-h: 64px;
    --search-h: 80px;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Nunito', sans-serif; background: #f5f5f4; }

  /* HEADER */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 900;
    height: var(--header-h);
    background: var(--white);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
  }
  .header-brand { display: flex; align-items: center; gap: 10px; }
  .header-logo {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--orange), var(--orange-light));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .header-title { font-size: 20px; font-weight: 900; color: var(--orange); letter-spacing: -0.5px; }
  .header-badge {
    display: flex; align-items: center; gap: 6px;
    background: #dcfce7; color: #15803d;
    font-size: 11px; font-weight: 800;
    padding: 5px 11px; border-radius: 20px;
    letter-spacing: 0.3px;
  }
  .dot-live { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; animation: blink 1.3s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

  /* MAP */
  #map {
    position: fixed;
    top: var(--header-h);
    left: 0; right: 0;
    bottom: var(--nav-h);
    z-index: 1;
  }

  /* SEARCH OVERLAY - BOTTOM ABOVE NAV */
  .search-overlay {
    position: fixed;
    bottom: var(--nav-h);
    left: 0; right: 0;
    z-index: 800;
    background: var(--white);
    border-top: 1px solid var(--border);
    padding: 12px 16px 14px;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.1);
  }
  .search-label {
    font-size: 11px; font-weight: 800; color: var(--muted);
    letter-spacing: 0.8px; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .search-row { display: flex; gap: 10px; align-items: center; }
  .search-input {
    flex: 1;
    height: 46px;
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 0 16px;
    font-size: 15px; font-weight: 700;
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    background: #fafaf9;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    letter-spacing: 1px;
  }
  .search-input:focus { border-color: var(--orange); background: var(--white); }
  .search-input::placeholder { color: #c4b5aa; font-weight: 600; letter-spacing: 0; font-size: 13px; }
  .btn-buscar {
    height: 46px; min-width: 46px;
    background: linear-gradient(135deg, var(--orange), var(--orange-light));
    border: none; border-radius: 14px;
    color: #fff; font-size: 13px; font-weight: 800;
    font-family: 'Nunito', sans-serif;
    padding: 0 18px; cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-buscar:hover { opacity: 0.9; transform: scale(1.02); }
  .btn-buscar:active { transform: scale(0.97); }

  /* RESULT TOAST */
  .result-toast {
    position: fixed;
    bottom: calc(var(--nav-h) + 90px);
    left: 16px; right: 16px;
    z-index: 850;
    background: var(--white);
    border-radius: 18px;
    padding: 14px 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    border-left: 5px solid var(--orange);
    display: none;
    animation: slideUp 0.3s cubic-bezier(.22,1,.36,1);
  }
  @keyframes slideUp { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
  .toast-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .toast-code { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; }
  .toast-close { font-size: 20px; color: #c4b5aa; cursor: pointer; line-height: 1; font-weight: 700; }
  .toast-close:hover { color: var(--orange); }
  .toast-estado { font-size: 17px; font-weight: 900; margin-bottom: 4px; }
  .toast-detalle { font-size: 13px; font-weight: 600; color: var(--muted); }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
    height: var(--nav-h);
    background: var(--white);
    border-top: 1px solid var(--border);
    display: flex; align-items: stretch;
  }
  .nav-tab {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px; cursor: pointer;
    text-decoration: none; color: #a8a29e;
    font-size: 10px; font-weight: 800; letter-spacing: 0.3px;
    transition: color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-tab.active { color: var(--orange); }
  .nav-tab svg { width: 24px; height: 24px; stroke-width: 2; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .nav-tab.active .nav-dot {
    width: 5px; height: 5px; background: var(--orange); border-radius: 50%; margin-top: 1px;
  }
  .nav-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 1px; }

  /* MOTO PULSE CSS para Leaflet divIcon */
  @keyframes pulsate {
    0% { transform: translate(-50%,-50%) scale(0.4); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(2.8); opacity: 0; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-brand">
    <div class="header-logo">🛵</div>
    <span class="header-title">WIL</span>
  </div>
  <div class="header-badge">
    <div class="dot-live"></div>
    EN VIVO · COPACABANA
  </div>
</header>

<!-- MAP -->
<div id="map"></div>

<!-- SEARCH PANEL BOTTOM -->
<div class="search-overlay">
  <div class="search-label">🔍 Rastrear pedido</div>
  <div class="search-row">
    <input class="search-input" id="codigoInput" type="text" placeholder="Ej: WIL-2841" maxlength="20" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="btn-buscar" onclick="buscarPedido()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Buscar
    </button>
  </div>
</div>

<!-- RESULT TOAST -->
<div class="result-toast" id="resultToast">
  <div class="toast-header">
    <span class="toast-code">Pedido #<span id="toastCodigo"></span></span>
    <span class="toast-close" onclick="document.getElementById('resultToast').style.display='none'">×</span>
  </div>
  <div class="toast-estado" id="toastEstado"></div>
  <div class="toast-detalle" id="toastDetalle"></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="nav-tab" href="pedido-wil.html">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    HOME
    <div class="nav-dot"></div>
  </a>
  <a class="nav-tab active" href="pedidoRastreo.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v2M12 16v2M6 12H4M20 12h-2M7.76 7.76l-1.42-1.42M17.66 17.66l-1.42-1.42M7.76 16.24l-1.42 1.42M17.66 6.34l-1.42 1.42"/></svg>
    RASTREO
    <div class="nav-dot"></div>
  </a>
  <a class="nav-tab" href="perfilCliente.html">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    PERFIL
    <div class="nav-dot"></div>
  </a>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', {
  center: [6.3499, -75.5025],
  zoom: 15,
  zoomControl: false,
  scrollWheelZoom: true
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 19
}).addTo(map);

L.control.zoom({ position: 'topright' }).addTo(map);

const motos = [
  { id: 'M01', lat: 6.3515, lng: -75.5040, nombre: 'Carlos R.', pedido: 'WIL-2841', eta: '~8 min' },
  { id: 'M02', lat: 6.3480, lng: -75.5010, nombre: 'Andrés M.', pedido: 'WIL-2842', eta: 'Entregado' },
  { id: 'M03', lat: 6.3530, lng: -75.5000, nombre: 'Luis H.', pedido: 'WIL-2843', eta: '~15 min' },
  { id: 'M04', lat: 6.3465, lng: -75.5050, nombre: 'Felipe G.', pedido: 'WIL-2844', eta: '~12 min' },
];

function motoHTML(id) {
  return `<div style="position:relative;width:56px;height:56px;">
    <div style="position:absolute;top:50%;left:50%;width:48px;height:48px;border-radius:50%;border:3px solid #ea580c;transform:translate(-50%,-50%);animation:pulsate 1.8s ease-out infinite;opacity:0;pointer-events:none;"></div>
    <div style="position:absolute;top:50%;left:50%;width:48px;height:48px;border-radius:50%;border:3px solid #f97316;transform:translate(-50%,-50%);animation:pulsate 1.8s ease-out 0.6s infinite;opacity:0;pointer-events:none;"></div>
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;background:linear-gradient(135deg,#ea580c,#f97316);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(234,88,12,0.55);font-size:19px;z-index:2;">🛵</div>
    <div style="position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;white-space:nowrap;font-family:Nunito,sans-serif;letter-spacing:0.3px;z-index:3;">${id}</div>
  </div>`;
}

motos.forEach(m => {
  const icon = L.divIcon({ className: '', html: motoHTML(m.id), iconSize: [56, 76], iconAnchor: [28, 28], popupAnchor: [0, -32] });
  const marker = L.marker([m.lat, m.lng], { icon }).addTo(map);
  marker.bindPopup(`
    <div style="font-family:Nunito,sans-serif;padding:4px 2px;min-width:170px;">
      <div style="font-weight:900;font-size:15px;color:#ea580c;margin-bottom:2px;">🛵 ${m.nombre}</div>
      <div style="font-size:12px;color:#78716c;font-weight:700;margin-bottom:8px;">Mensajero ${m.id}</div>
      <div style="background:#fff7ed;border-radius:10px;padding:8px 10px;">
        <div style="font-size:11px;color:#a8a29e;font-weight:700;letter-spacing:0.5px;margin-bottom:2px;">PEDIDO</div>
        <div style="font-size:14px;font-weight:900;color:#1c1917;">${m.pedido}</div>
        <div style="font-size:12px;font-weight:700;color:#22c55e;margin-top:3px;">● ${m.eta === 'Entregado' ? '✅ Entregado' : 'En camino · ETA ' + m.eta}</div>
      </div>
    </div>
  `);
});

const pedidos = {
  'WIL-2841': { estado: '🛵 En camino', detalle: 'Carlos R. · ETA ~8 min', color: '#ea580c' },
  'WIL-2842': { estado: '✅ Entregado', detalle: 'Andrés M. · Entregado hace 5 min', color: '#15803d' },
  'WIL-2843': { estado: '⏳ Preparando', detalle: 'Luis H. · Recogiendo pedido', color: '#d97706' },
  'WIL-2844': { estado: '🛵 En camino', detalle: 'Felipe G. · ETA ~12 min', color: '#ea580c' },
};

function buscarPedido() {
  const codigo = document.getElementById('codigoInput').value.trim().toUpperCase();
  if (!codigo) { document.getElementById('codigoInput').focus(); return; }
  const toast = document.getElementById('resultToast');
  const info = pedidos[codigo];
  document.getElementById('toastCodigo').textContent = codigo;
  if (info) {
    document.getElementById('toastEstado').textContent = info.estado;
    document.getElementById('toastEstado').style.color = info.color;
    document.getElementById('toastDetalle').textContent = '📍 ' + info.detalle;
    toast.style.borderLeftColor = info.color;
  } else {
    document.getElementById('toastEstado').textContent = '❌ Pedido no encontrado';
    document.getElementById('toastEstado').style.color = '#dc2626';
    document.getElementById('toastDetalle').textContent = 'Verifica el código e intenta de nuevo.';
    toast.style.borderLeftColor = '#dc2626';
  }
  toast.style.display = 'block';
}

document.getElementById('codigoInput').addEventListener('keydown', e => { if (e.key === 'Enter') buscarPedido(); });
</script>
</body>
</html>
