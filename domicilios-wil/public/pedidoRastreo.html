<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>WIL – Rastreo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #0ceac9;
    --orange-light: #0fe4f3;
    --dark: #1c1917;
    --text: #292524;
    --muted: #78716c;
    --border: #e7e5e4;
    --white: #ffffff;
    --nav-h: 70px;
    --header-h: 64px;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Nunito', sans-serif; background: #f5f5f4; }

  /* HEADER */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 900;
    height: var(--header-h);
    background: var(--white);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
  }
  .header-brand { display: flex; align-items: center; gap: 10px; }
  .header-logo {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--orange), var(--orange-light));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .header-title { font-size: 20px; font-weight: 900; color: var(--orange); letter-spacing: -0.5px; }
  .header-badge {
    display: flex; align-items: center; gap: 6px;
    background: #dcfce7; color: #15803d;
    font-size: 11px; font-weight: 800;
    padding: 5px 11px; border-radius: 20px;
  }
  .dot-live { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; animation: blink 1.3s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

  /* MAP */
  #map {
    position: fixed;
    top: var(--header-h); left: 0; right: 0;
    bottom: var(--nav-h);
    z-index: 1;
  }

  /* SEARCH PANEL */
  .search-overlay {
    position: fixed;
    bottom: var(--nav-h); left: 0; right: 0;
    z-index: 800;
    background: var(--white);
    border-top: 1px solid var(--border);
    padding: 12px 16px 14px;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.1);
  }
  .search-label { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 8px; }
  .search-row { display: flex; gap: 10px; align-items: center; }
  .search-input {
    flex: 1; height: 46px;
    border: 2px solid var(--border); border-radius: 14px;
    padding: 0 16px; font-size: 15px; font-weight: 700;
    font-family: 'Nunito', sans-serif; color: var(--text);
    background: #fafaf9; outline: none;
    transition: border-color 0.2s, background 0.2s;
    letter-spacing: 1px;
  }
  .search-input:focus { border-color: var(--orange); background: var(--white); }
  .search-input::placeholder { color: #c4b5aa; font-weight: 600; letter-spacing: 0; font-size: 13px; }
  .btn-buscar {
    height: 46px; min-width: 46px;
    background: linear-gradient(135deg, var(--orange), var(--orange-light));
    border: none; border-radius: 14px;
    color: #fff; font-size: 13px; font-weight: 800;
    font-family: 'Nunito', sans-serif;
    padding: 0 18px; cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-buscar:hover { opacity: 0.9; transform: scale(1.02); }
  .btn-buscar:active { transform: scale(0.97); }
  .btn-buscar:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* TOAST */
  .result-toast {
    position: fixed;
    bottom: calc(var(--nav-h) + 90px);
    left: 16px; right: 16px;
    z-index: 850;
    background: var(--white);
    border-radius: 18px;
    padding: 16px 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    border-left: 5px solid var(--orange);
    display: none;
    animation: slideUp 0.3s cubic-bezier(.22,1,.36,1);
  }
  @keyframes slideUp { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
  .toast-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .toast-code { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; }
  .toast-close { font-size: 22px; color: #c4b5aa; cursor: pointer; line-height: 1; font-weight: 700; }
  .toast-close:hover { color: var(--orange); }
  .toast-title { font-size: 17px; font-weight: 900; margin-bottom: 4px; }
  .toast-sub { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 14px; }
  .btn-ver-detalle {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 44px;
    background: linear-gradient(135deg, var(--orange), var(--orange-light));
    border: none; border-radius: 12px;
    color: #fff; font-size: 14px; font-weight: 800;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }
  .btn-ver-detalle:hover { opacity: 0.9; transform: scale(1.01); }
  .btn-ver-detalle:active { transform: scale(0.97); }

  /* TOAST ERROR */
  .toast-error { border-left-color: #dc2626 !important; }
  .toast-error .toast-title { color: #dc2626; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
    height: var(--nav-h);
    background: var(--white);
    border-top: 1px solid var(--border);
    display: flex; align-items: stretch;
  }
  .nav-tab {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px; cursor: pointer;
    text-decoration: none; color: #a8a29e;
    font-size: 10px; font-weight: 800; letter-spacing: 0.3px;
    transition: color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-tab.active { color: var(--orange); }
  .nav-tab svg { width: 24px; height: 24px; stroke-width: 2; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .nav-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 1px; }
  .nav-tab.active .nav-dot { background: var(--orange); }

  @keyframes pulsate {
    0% { transform: translate(-50%,-50%) scale(0.4); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(2.8); opacity: 0; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="header-logo">🛵</div>
    <span class="header-title">WIL</span>
  </div>
  <div class="header-badge">
    <div class="dot-live"></div>
    EN VIVO · COPACABANA
  </div>
</header>

<div id="map"></div>

<div class="search-overlay">
  <div class="search-label">🔍 Rastrear pedido</div>
  <div class="search-row">
    <input class="search-input" id="codigoInput" type="text" placeholder="Ej: WIL-2841" maxlength="30"
      autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="btn-buscar" id="btnBuscar" onclick="buscarPedido()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Buscar
    </button>
  </div>
</div>

<!-- TOAST: pedido encontrado -->
<div class="result-toast" id="toastOk">
  <div class="toast-header">
    <span class="toast-code">Pedido #<span id="okCodigo"></span></span>
    <span class="toast-close" onclick="cerrarToast('toastOk')">×</span>
  </div>
  <div class="toast-title">🟢 Pedido activo</div>
  <div class="toast-sub">Tu pedido está en curso. Toca para ver el detalle.</div>
  <button class="btn-ver-detalle" id="btnDetalle">
    Ver detalle del pedido
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </button>
</div>

<!-- TOAST: pedido no encontrado -->
<div class="result-toast toast-error" id="toastErr">
  <div class="toast-header">
    <span class="toast-code">Código: <span id="errCodigo"></span></span>
    <span class="toast-close" onclick="cerrarToast('toastErr')">×</span>
  </div>
  <div class="toast-title">❌ Pedido no encontrado</div>
  <div class="toast-sub">Verifica el código e intenta de nuevo.</div>
</div>

<nav class="bottom-nav">
  <a class="nav-tab" href="pedido-wil.html">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    HOME<div class="nav-dot"></div>
  </a>
  <a class="nav-tab active" href="pedidoRastreo.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v2M12 16v2M6 12H4M20 12h-2M7.76 7.76l-1.42-1.42M17.66 17.66l-1.42-1.42M7.76 16.24l-1.42 1.42M17.66 6.34l-1.42 1.42"/></svg>
    RASTREO<div class="nav-dot"></div>
  </a>
  <a class="nav-tab" href="perfilCliente.html">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    PERFIL<div class="nav-dot"></div>
  </a>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── MAPA ──────────────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [6.3499, -75.5025],
  zoom: 15,
  zoomControl: false,
  scrollWheelZoom: true
});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 19
}).addTo(map);
L.control.zoom({ position: 'topright' }).addTo(map);

// ── MOTOS (solo posición y movimiento, sin lógica de estado) ──────────────────
const motosData = [
  { id: 'M01', waypoints: [[6.3515,-75.5040],[6.3518,-75.5032],[6.3521,-75.5025],[6.3516,-75.5018],[6.3510,-75.5012],[6.3505,-75.5020],[6.3500,-75.5030],[6.3495,-75.5038],[6.3490,-75.5045],[6.3495,-75.5052],[6.3502,-75.5058]] },
  { id: 'M02', waypoints: [[6.3480,-75.5010],[6.3475,-75.5005],[6.3470,-75.5000],[6.3465,-75.5008],[6.3460,-75.5015],[6.3455,-75.5022],[6.3460,-75.5030],[6.3468,-75.5035],[6.3475,-75.5028],[6.3480,-75.5020],[6.3485,-75.5012]] },
  { id: 'M03', waypoints: [[6.3530,-75.5000],[6.3535,-75.4995],[6.3540,-75.4990],[6.3545,-75.4998],[6.3542,-75.5006],[6.3537,-75.5012],[6.3530,-75.5018],[6.3525,-75.5010],[6.3520,-75.5002],[6.3515,-75.4995],[6.3510,-75.4990]] },
  { id: 'M04', waypoints: [[6.3465,-75.5050],[6.3470,-75.5058],[6.3475,-75.5065],[6.3482,-75.5060],[6.3488,-75.5052],[6.3492,-75.5045],[6.3498,-75.5040],[6.3504,-75.5048],[6.3510,-75.5055],[6.3515,-75.5062],[6.3520,-75.5068]] },
  { id: 'M05', waypoints: [[6.3508,-75.5070],[6.3512,-75.5063],[6.3516,-75.5055],[6.3520,-75.5048],[6.3524,-75.5042],[6.3528,-75.5035],[6.3532,-75.5028],[6.3528,-75.5020],[6.3522,-75.5015],[6.3516,-75.5008],[6.3510,-75.5002]] },
  { id: 'M06', waypoints: [[6.3445,-75.5035],[6.3450,-75.5028],[6.3455,-75.5020],[6.3460,-75.5012],[6.3465,-75.5005],[6.3470,-75.4998],[6.3475,-75.5005],[6.3470,-75.5012],[6.3465,-75.5020],[6.3460,-75.5028],[6.3455,-75.5035]] },
  { id: 'M07', waypoints: [[6.3490,-75.4980],[6.3495,-75.4988],[6.3500,-75.4995],[6.3505,-75.5002],[6.3510,-75.5010],[6.3515,-75.5017],[6.3520,-75.5025],[6.3525,-75.5032],[6.3530,-75.5040],[6.3535,-75.5048],[6.3540,-75.5055]] },
  { id: 'M08', waypoints: [[6.3555,-75.5020],[6.3550,-75.5028],[6.3545,-75.5035],[6.3540,-75.5042],[6.3535,-75.5050],[6.3530,-75.5057],[6.3525,-75.5065],[6.3520,-75.5072],[6.3515,-75.5078],[6.3510,-75.5070],[6.3505,-75.5062]] },
  { id: 'M09', waypoints: [[6.3435,-75.5010],[6.3440,-75.5018],[6.3445,-75.5025],[6.3450,-75.5032],[6.3455,-75.5040],[6.3460,-75.5048],[6.3455,-75.5055],[6.3448,-75.5050],[6.3442,-75.5043],[6.3436,-75.5036],[6.3430,-75.5028]] },
  { id: 'M10', waypoints: [[6.3560,-75.5045],[6.3555,-75.5038],[6.3550,-75.5030],[6.3545,-75.5022],[6.3540,-75.5015],[6.3535,-75.5008],[6.3530,-75.5000],[6.3525,-75.4993],[6.3520,-75.4985],[6.3515,-75.4978],[6.3510,-75.4970]] },
  { id: 'M11', waypoints: [[6.3472,-75.5075],[6.3478,-75.5068],[6.3484,-75.5060],[6.3490,-75.5053],[6.3496,-75.5045],[6.3502,-75.5038],[6.3508,-75.5030],[6.3514,-75.5023],[6.3520,-75.5015],[6.3526,-75.5008],[6.3532,-75.5000]] },
  { id: 'M12', waypoints: [[6.3425,-75.5060],[6.3430,-75.5052],[6.3435,-75.5044],[6.3440,-75.5037],[6.3445,-75.5030],[6.3450,-75.5022],[6.3455,-75.5015],[6.3460,-75.5008],[6.3465,-75.5000],[6.3470,-75.4993],[6.3475,-75.4985]] },
];

function motoHTML(id) {
  return `<div style="position:relative;width:56px;height:56px;">
    <div style="position:absolute;top:50%;left:50%;width:48px;height:48px;border-radius:50%;border:3px solid #ea580c;transform:translate(-50%,-50%);animation:pulsate 1.8s ease-out infinite;opacity:0;pointer-events:none;"></div>
    <div style="position:absolute;top:50%;left:50%;width:48px;height:48px;border-radius:50%;border:3px solid #f97316;transform:translate(-50%,-50%);animation:pulsate 1.8s ease-out 0.6s infinite;opacity:0;pointer-events:none;"></div>
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;background:linear-gradient(135deg,#ea580c,#f97316);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(234,88,12,0.55);font-size:19px;z-index:2;">🛵</div>
    <div style="position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;white-space:nowrap;font-family:Nunito,sans-serif;z-index:3;">${id}</div>
  </div>`;
}

const motoState = {};
const markers = {};

motosData.forEach(m => {
  const startIdx = Math.floor(Math.random() * m.waypoints.length);
  motoState[m.id] = { wpIdx: startIdx, dir: 1, progress: Math.random(), speed: 0.008 + Math.random() * 0.012 };
  const icon = L.divIcon({ className: '', html: motoHTML(m.id), iconSize: [56, 76], iconAnchor: [28, 28] });
  markers[m.id] = L.marker(m.waypoints[startIdx], { icon }).addTo(map);
});

function lerp(a, b, t) { return a + (b - a) * t; }
function animateMotos() {
  motosData.forEach(m => {
    const st = motoState[m.id];
    st.progress += st.speed;
    if (st.progress >= 1) {
      st.progress = 0;
      st.wpIdx += st.dir;
      if (st.wpIdx >= m.waypoints.length - 1) { st.wpIdx = m.waypoints.length - 1; st.dir = -1; }
      else if (st.wpIdx <= 0) { st.wpIdx = 0; st.dir = 1; }
    }
    const nextIdx = Math.min(Math.max(st.wpIdx + st.dir, 0), m.waypoints.length - 1);
    const curr = m.waypoints[st.wpIdx];
    const next = m.waypoints[nextIdx];
    markers[m.id].setLatLng([lerp(curr[0], next[0], st.progress), lerp(curr[1], next[1], st.progress)]);
  });
  requestAnimationFrame(animateMotos);
}
animateMotos();

// ── BÚSQUEDA CON API ──────────────────────────────────────────────────────────
let codigoActivo = '';

async function buscarPedido() {
  const codigo = document.getElementById('codigoInput').value.trim().toUpperCase();
  if (!codigo) { document.getElementById('codigoInput').focus(); return; }

  cerrarToast('toastOk');
  cerrarToast('toastErr');

  const btn = document.getElementById('btnBuscar');
  btn.disabled = true;
  btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.8s linear infinite">
    <path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Buscando…`;

  try {
    // ── Reemplaza esta URL con tu endpoint real ──────────────────────────────
    // El endpoint debe responder con { existe: true } si el pedido existe,
    // o { existe: false } / 404 si no existe.
    const res = await fetch(`/api/pedidos/${encodeURIComponent(codigo)}`);

    if (res.ok) {
      // Pedido encontrado → mostrar toast y preparar redirección
      codigoActivo = codigo;
      document.getElementById('okCodigo').textContent = codigo;
      document.getElementById('toastOk').style.display = 'block';

      document.getElementById('btnDetalle').onclick = () => {
        window.location.href = `detallePedido.html?id=${encodeURIComponent(codigo)}`;
      };
    } else {
      // 404 u otro error → pedido no existe
      document.getElementById('errCodigo').textContent = codigo;
      document.getElementById('toastErr').style.display = 'block';
    }
  } catch (e) {
    // Error de red
    document.getElementById('errCodigo').textContent = codigo;
    document.getElementById('toastErr').style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> Buscar`;
  }
}

function cerrarToast(id) {
  document.getElementById(id).style.display = 'none';
}

document.getElementById('codigoInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') buscarPedido();
});
</script>

<style>
@keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
</style>
</body>
</html>
