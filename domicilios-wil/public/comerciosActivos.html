<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Comercios · Food Display Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:      #080808;
    --surface: #121212;
    --card:    #161616;
    --border:  rgba(255,255,255,0.07);
    --accent:  #f0a500;
    --accent2: #ff6b35;
    --text:    #f0f0f0;
    --muted:   #5a5a5a;
    --r:       16px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 55% 35% at 15% 5%,  rgba(240,165,0,.09) 0%, transparent 65%),
      radial-gradient(ellipse 45% 45% at 85% 90%, rgba(255,107,53,.06) 0%, transparent 65%);
  }

  /* HEADER */
  header {
    position: relative; z-index: 5;
    padding: 3rem 1.5rem 0; text-align: center;
  }
  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.9rem, 5vw, 3rem);
    font-weight: 800; letter-spacing: -.025em; line-height: 1.1;
  }
  header h1 em {
    font-style: normal;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  header p { margin-top: .6rem; color: var(--muted); font-size: .9rem; }

  /* CAROUSEL */
  .scene { position: relative; z-index: 5; padding: 2.8rem 0 1.5rem; overflow: hidden; }
  .track-wrap { overflow: hidden; }
  .track {
    display: flex; gap: 1.2rem;
    transition: transform .42s cubic-bezier(.4,0,.2,1);
    padding: 0.4rem calc(50vw - 155px) 0.8rem;
    will-change: transform;
  }

  /* CARD */
  .card {
    flex: 0 0 300px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--r); overflow: hidden; cursor: pointer;
    transition: transform .38s cubic-bezier(.4,0,.2,1),
                opacity    .38s ease,
                box-shadow .38s ease,
                border-color .3s ease;
    opacity: .4; transform: scale(.87);
  }
  .card.active {
    opacity: 1; transform: scale(1);
    border-color: rgba(240,165,0,.3);
    box-shadow: 0 24px 64px rgba(0,0,0,.55), 0 0 0 1px rgba(240,165,0,.1);
  }
  .card:hover:not(.active) { opacity: .65; transform: scale(.9); }

  .card-img { width: 100%; height: 180px; object-fit: cover; display: block; background: var(--surface); }
  .no-img {
    width: 100%; height: 180px;
    background: linear-gradient(135deg,#1b1b1b,#232323);
    display: flex; align-items: center; justify-content: center; font-size: 3.2rem;
  }

  .badge-active {
    position: absolute; top: .75rem; right: .75rem;
    background: rgba(0,0,0,.6); backdrop-filter: blur(8px);
    border: 1px solid rgba(74,222,128,.2); color: #4ade80;
    font-size: .65rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    padding: .22rem .65rem; border-radius: 999px;
    display: flex; align-items: center; gap: .3rem;
  }
  .badge-active::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: #4ade80; animation: blink 1.8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .card-body { padding: 1.1rem 1.3rem 1.3rem; position: relative; }
  .card-name {
    font-family: 'Syne', sans-serif; font-size: 1.08rem; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: .5rem;
  }
  .card-info { display: flex; flex-direction: column; gap: .28rem; margin-bottom: 1rem; }
  .card-info span {
    font-size: .78rem; color: var(--muted);
    display: flex; align-items: flex-start; gap: .45rem; line-height: 1.35;
  }
  .card-info span svg { flex-shrink: 0; margin-top: 1px; opacity: .6; }

  .btn {
    width: 100%; padding: .72rem; border: none; border-radius: 10px;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    color: #080808; font-family: 'Syne', sans-serif;
    font-size: .88rem; font-weight: 700; cursor: pointer; letter-spacing: .02em;
    transition: opacity .2s, transform .15s;
  }
  .btn:hover  { opacity: .85; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  /* INDICADORES */
  .dots { display: flex; justify-content: center; gap: .45rem; padding: .2rem 0 .8rem; }
  .dot {
    width: 7px; height: 7px; border-radius: 999px;
    background: rgba(255,255,255,.12); cursor: pointer; transition: all .3s ease;
  }
  .dot.on { width: 26px; background: var(--accent); }

  /* FLECHAS */
  .arr {
    position: absolute; top: 50%; transform: translateY(-55%);
    z-index: 20; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    color: var(--text); font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px); transition: background .2s;
  }
  .arr:hover { background: rgba(255,255,255,.11); }
  .arr.l { left: .8rem; }
  .arr.r { right: .8rem; }

  .counter { text-align: center; font-size: .78rem; color: var(--muted); padding-bottom: 1rem; position: relative; z-index: 5; }
  .counter b { color: var(--text); }

  /* ESTADOS */
  .state {
    position: relative; z-index: 5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 5rem 2rem; gap: 1rem; text-align: center;
  }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.08); border-top-color: var(--accent);
    animation: spin .65s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state p { color: var(--muted); font-size: .9rem; }
  .state p.err { color: #f87171; }
  .retry {
    padding: .55rem 1.5rem; border-radius: 8px;
    border: 1px solid rgba(240,165,0,.3); background: transparent;
    color: var(--accent); font-size: .85rem; cursor: pointer; transition: background .2s;
  }
  .retry:hover { background: rgba(240,165,0,.08); }

  @media (max-width: 560px) {
    .track { padding: 0.4rem calc(50vw - 140px) 0.8rem; gap: .9rem; }
    .card  { flex: 0 0 272px; }
    .arr   { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Elige tu <em>comercio</em></h1>
  <p>Selecciona tu negocio para ingresar al panel</p>
</header>

<div class="state" id="st-load">
  <div class="spinner"></div>
  <p>Cargando comercios…</p>
</div>

<div class="state" id="st-err" style="display:none">
  <p class="err" id="err-msg">No se pudo conectar.</p>
  <button class="retry" onclick="init()">↺ Reintentar</button>
</div>

<div class="state" id="st-empty" style="display:none">
  <p>No hay comercios activos en este momento.</p>
</div>

<section class="scene" id="scene" style="display:none">
  <button class="arr l" onclick="go(-1)">&#8592;</button>
  <button class="arr r" onclick="go(1)">&#8594;</button>
  <div class="track-wrap">
    <div class="track" id="track"></div>
  </div>
  <div class="dots" id="dots"></div>
  <p class="counter"><b id="cur">1</b> / <b id="tot">1</b></p>
</section>

<script>
const API   = 'https://food-display-pro.vercel.app/api/comercios'
const LOGIN = 'https://food-display-pro.vercel.app/login'

let data = [], cur = 0, sx = 0, drag = false, timer = null

async function fetchData() {
  const r = await fetch(API)
  if (!r.ok) throw new Error('HTTP ' + r.status)
  return r.json()
}

function icon(path) {
  return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>'
}
const ICO_TEL  = icon('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12 19.79 19.79 0 0 1 1.07 3.36 2 2 0 0 1 3.05 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16z"/>')
const ICO_ADDR = icon('<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>')

function render() {
  const track = document.getElementById('track')
  const dots  = document.getElementById('dots')

  track.innerHTML = data.map(function(c, i) {
    var img  = c.config && c.config.image   ? c.config.image   : null
    var tel  = c.config && c.config.phone   ? c.config.phone   : (c.telefono || '')
    var addr = c.config && c.config.address ? c.config.address : ''
    var aid  = c.adminId || ''
    var nom  = c.nombre  || ''

    return '<div class="card' + (i===0?' active':'') + '" data-i="' + i + '" onclick="selec(' + i + ')">' +
      '<div style="position:relative">' +
        (img
          ? '<img class="card-img" src="' + img + '" alt="' + nom + '" loading="lazy" onerror="this.outerHTML=\'<div class=no-img>🍽️</div>\'"/>'
          : '<div class="no-img">🍽️</div>') +
        '<div class="badge-active">Activo</div>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-name">' + nom + '</div>' +
        '<div class="card-info">' +
          (tel  ? '<span>' + ICO_TEL  + tel  + '</span>' : '') +
          (addr ? '<span>' + ICO_ADDR + addr + '</span>' : '') +
        '</div>' +
        '<button class="btn" onclick="event.stopPropagation();login(\'' + aid + '\',\'' + encodeURIComponent(nom) + '\')">Ingresar →</button>' +
      '</div>' +
    '</div>'
  }).join('')

  dots.innerHTML = data.map(function(_,i) {
    return '<div class="dot' + (i===0?' on':'') + '" onclick="moveTo(' + i + ')"></div>'
  }).join('')

  document.getElementById('tot').textContent = data.length
  sync()
}

function moveTo(idx) {
  cur = Math.max(0, Math.min(idx, data.length - 1))
  sync()
}
function go(d) { moveTo(cur + d) }
function selec(i) { moveTo(i) }

function sync() {
  var track = document.getElementById('track')
  var cards = track.querySelectorAll('.card')
  if (!cards.length) return
  var cw = cards[0].offsetWidth
  track.style.transform = 'translateX(-' + (cur * (cw + 19)) + 'px)'
  cards.forEach(function(c,i){ c.classList.toggle('active', i===cur) })
  document.querySelectorAll('.dot').forEach(function(d,i){ d.classList.toggle('on', i===cur) })
  document.getElementById('cur').textContent = cur + 1
}

function login(adminId, nombre) {
  window.location.href = LOGIN + '?adminId=' + encodeURIComponent(adminId) + '&nombre=' + nombre
}

function initSwipe() {
  var w = document.querySelector('.track-wrap')
  w.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX }, {passive:true})
  w.addEventListener('touchend',   function(e){
    var dx = e.changedTouches[0].clientX - sx
    if (Math.abs(dx) > 38) go(dx < 0 ? 1 : -1)
  }, {passive:true})
  w.addEventListener('mousedown', function(e){ sx = e.clientX; drag = true })
  window.addEventListener('mouseup', function(e){
    if (!drag) return; drag = false
    var dx = e.clientX - sx
    if (Math.abs(dx) > 38) go(dx < 0 ? 1 : -1)
  })
}

document.addEventListener('keydown', function(e){
  if (!data.length) return
  if (e.key==='ArrowLeft')  go(-1)
  if (e.key==='ArrowRight') go(1)
})

function startAuto() {
  stopAuto()
  if (data.length < 2) return
  timer = setInterval(function(){ moveTo((cur+1) % data.length) }, 6000)
}
function stopAuto() { clearInterval(timer) }

var scene = document.getElementById('scene')
scene.addEventListener('mouseenter', stopAuto)
scene.addEventListener('mouseleave', startAuto)
scene.addEventListener('touchstart',  stopAuto, {passive:true})

function show(id) {
  ['st-load','st-err','st-empty','scene'].forEach(function(s){
    document.getElementById(s).style.display = s===id ? (s==='scene'?'block':'flex') : 'none'
  })
}

async function init() {
  show('st-load')
  try {
    data = await fetchData()
    if (!data.length) { show('st-empty'); return }
    show('scene')
    render()
    initSwipe()
    startAuto()
  } catch(e) {
    document.getElementById('err-msg').textContent = 'Error: ' + e.message
    show('st-err')
  }
}

init()
</script>
</body>
</html>
